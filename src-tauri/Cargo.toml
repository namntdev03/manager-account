[package]
name = "manager-account"
version = "0.2.3"
description = "Chuyển nhanh giữa nhiều tài khoản Git"
edition = "2021"

[lib]
name = "manager_account_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Terminal SSH tích hợp trong app (PTY chạy trên cả macOS, Windows, Linux)
portable-pty = "0.8"
base64 = "0.22"
# Đo RAM/CPU của chính app (trang Hiệu năng)
sysinfo = "0.30"
# Sao lưu/khôi phục: mã hoá file bằng mật khẩu (Argon2id + ChaCha20-Poly1305)
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"

# Kho bảo mật của từng hệ điều hành (lưu token)
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
